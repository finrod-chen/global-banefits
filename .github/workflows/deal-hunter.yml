
name: Deal Radar Scan

on:
  schedule:
    # 每 2 小時執行一次（UTC 時間；GitHub 排程可能有 10 到 30 分鐘延遲）
    - cron: '23 */2 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deal-radar
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 三個 secrets 都是選填：沒設 LLM_API_KEY 就不做 AI 提取，沒設 Telegram 就不推播
      - name: Scan sources
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node scripts/scan.mjs

      - name: Rebuild dashboards
        run: node scripts/build-dashboards.mjs

      - name: Commit and push updates
        run: |
          git config user.name "deal-radar-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data dashboards
          if git diff --cached --quiet; then
            echo "No changes this run"
          else
            git commit -m "auto: scan update $(date -u +%Y-%m-%dT%H:%M+00:00)"
            # 掃描要跑幾分鐘，期間可能有人審核推了提交；先併入再推送（只動不同條目時 git 能自動合併）
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi
