name: Review Deal

# 人工審核一條 AI 草稿：核實通過（可填估算價值）或退回。
# 可以在 Actions 頁按 Run workflow 手動執行，也可以從看板的管理模式按鈕觸發（需要 Worker 設 GITHUB_TOKEN）。
on:
  workflow_dispatch:
    inputs:
      id:
        description: 優惠的 id（看板卡片或 data/deals.json 裡的 id）
        required: true
        type: string
      action:
        description: 動作
        required: true
        type: choice
        options:
          - verify
          - reject
      value_twd:
        description: 價值（新台幣，只在 verify 時用）。留空就採用 AI 估值（如果有）；填了就以你填的為準
        required: false
        default: ''
        type: string

permissions:
  contents: write

# 刻意不用 concurrency group：GitHub 同一組只保留一個等待中的執行，連續點幾次時中間的會被悄悄取消。
# 並行安全由 scripts/apply-review.sh 處理（在最新資料上重新套用，推送被拒就重來）。

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Apply review and push
        env:
          DEAL_ID: ${{ inputs.id }}
          ACTION: ${{ inputs.action }}
          VALUE_TWD: ${{ inputs.value_twd }}
        run: bash scripts/apply-review.sh
