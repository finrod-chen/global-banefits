
name: Deploy Deal Radar Worker

on:
  push:
    branches: [main]
    paths:
      - worker/**
      - .github/workflows/deploy-worker.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 主要部署路線是 Cloudflare Workers Builds（worker/deploy.sh）；這條是備援。
      # 沒設 secrets 時直接跳過，不讓每次 push 都亮紅燈。
      - name: Check Cloudflare secrets
        id: cf
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未設定 CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID，略過 GitHub Actions 部署（Worker 由 Cloudflare Workers Builds 部署）。"
          fi

      - uses: actions/setup-node@v4
        if: steps.cf.outputs.ready == 'true'
        with:
          node-version: '20'

      - name: Install wrangler
        if: steps.cf.outputs.ready == 'true'
        run: npm install -g wrangler

      - name: Ensure KV namespace and patch config
        if: steps.cf.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd worker
          NS_ID=$(wrangler kv namespace list | jq -r '.[] | select(.title | endswith("DEAL_DATA")) | .id' | head -1)
          if [ -z "$NS_ID" ] || [ "$NS_ID" = "null" ]; then
            OUT=$(wrangler kv namespace create DEAL_DATA)
            NS_ID=$(echo "$OUT" | grep -oE "[0-9a-f]{32}" | head -1)
            echo "created new namespace: $NS_ID"
          fi
          sed -i "s/REPLACE_WITH_NAMESPACE_ID/$NS_ID/" wrangler.toml
          echo "NS_ID=$NS_ID" >> "$GITHUB_ENV"

      - name: Deploy Worker
        if: steps.cf.outputs.ready == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: cd worker && wrangler deploy
