# GLOBAL DEAL RADAR 看板 Worker 設定（放在 repo 根目錄）
#
# Cloudflare Workers Builds 的 Root directory 是 /，Deploy command 是 `npx wrangler deploy`，
# 所以設定檔必須在根目錄；放在 worker/ 底下的話 Deploy command 找不到，每次 build 都會失敗。
#
# 看板的資料來自 GitHub repo 的 data/（見 worker/src/index.js），Worker 不自己掃描、不存資料，所以沒有 KV。
# 掃描與 AI 提取在 GitHub Actions：.github/workflows/deal-hunter.yml；Worker 的排程只負責每 2 小時去觸發它
# （需要 Worker 的 GITHUB_TOKEN，fine-grained token，Actions: Read and write）。
name = "global-banefits"
main = "worker/src/index.js"
compatibility_date = "2026-11-01"

# 保留在 Cloudflare 面板手動加的變數；Secret（LLM_API_KEY、ADMIN_TOKEN、GITHUB_TOKEN）本來就不會被部署清掉
keep_vars = true

# 每個偶數小時的第 5 分（UTC）觸發一次掃描。用 Cloudflare 的排程是因為 GitHub 自己的 schedule 在這個 repo 很不可靠：
# 實測 6 個時段只跑 2 次，而且晚 36 到 78 分鐘。
[triggers]
crons = ["5 */2 * * *"]

[vars]
REPO_SLUG = "finrod-chen/global-banefits"
REPO_BRANCH = "main"

# 非 production 分支的預覽（Cloudflare 對推到分支的 commit 執行 `wrangler preview`）要求另外寫 previews.vars，
# 否則會報 "Your Wrangler configuration is missing a `previews` block"。
# 看板只讀公開 repo 的資料，沒有任何寫入，所以預覽沿用相同的 repo 與分支是安全的。
[previews.vars]
REPO_SLUG = "finrod-chen/global-banefits"
REPO_BRANCH = "main"

# 開啟 Workers Logs，出問題可以在 Cloudflare 面板的 Observability 查
[observability]
enabled = true
