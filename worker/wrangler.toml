# GLOBAL DEAL RADAR 看板 Worker 設定
# 看板的資料來自 GitHub repo 的 data/（見 src/index.js），Worker 不再自己掃描，所以沒有排程。
# 掃描與 AI 提取在 GitHub Actions：.github/workflows/deal-hunter.yml
name = "global-banefits"
main = "src/index.js"
compatibility_date = "2026-11-01"

# 目前沒有程式使用這個 KV。保留只是因為 worker/deploy.sh 與 deploy-worker.yml 會建立並替換
# 下面的 id 佔位符，現在移除會讓你現有的部署流程失敗；之後確定不需要時再連同部署腳本一起清掉。
kv_namespaces = [ { binding = "DEAL_DATA", id = "REPLACE_WITH_NAMESPACE_ID" } ]

# 明確清空排程：舊版 Worker 設過每 2 小時的 cron，現在 Worker 已沒有 scheduled 處理程式。
[triggers]
crons = []

[vars]
REPO_SLUG = "finrod-chen/global-banefits"
REPO_BRANCH = "main"

# 開啟 Workers Logs，出問題可以在 Cloudflare 面板的 Observability 查
[observability]
enabled = true
